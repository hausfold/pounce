name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: nix build (aarch64-darwin)
    # The build shells out to /usr/bin/xcrun swiftc, so it needs a real Mac with
    # Xcode CLT — macos-14+ runners are Apple Silicon and ship Xcode. The floor
    # is the SDK, not the runner: Window.swift overrides `contextMenuKeyDown:` /
    # `showContextMenuForSelection:`, which NSResponder.h only declares at
    # macOS 15, and an SDK that never heard of a method cannot be overridden at
    # any deployment target. What the app RUNS on is unaffected — build.sh pins
    # -target to macos14.0, so a newer runner does not raise users' floor.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Determinate's installer relaxes the macOS build sandbox by default,
      # which the impure xcrun build requires.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - run: nix build .#pounce .#pounce-commands .#pounce-skill --print-build-logs

  test:
    name: frecency unit tests (swift)
    # Uses /usr/bin/xcrun swiftc, same as the app build — needs a real Mac, and
    # the same macOS 15 SDK for the same reason (see the build job).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: compile + run pure-logic tests
        run: pkgs/pounce/tests/run.sh

  commands:
    name: shellcheck pounce-commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The launcher's shell commands (pkgs/pounce-commands) — lint at warning
      # level (real bugs: undefined vars, bad quoting) on a fast Linux runner,
      # no Mac needed. Verified clean at this severity.
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning pkgs/pounce-commands/pounce-palette pkgs/pounce-commands/commands/*.sh pkgs/pounce-commands/optional/*.sh pkgs/pounce/ports
      # A rule with nothing enforcing it is a rule the thirteenth command
      # breaks silently. Every banner pounce draws goes through the `notify()`
      # helper (AGENTS.md § Notifications) so that trill can draw it and
      # rules.json can route it; a bare `display notification` is the one way
      # to bypass that, and it looks completely normal in review.
      #
      # `display dialog` is deliberately NOT matched — that is a modal question
      # (docker.sh, caffeinate.sh), not a banner, and trill has no verb for it.
      - name: no bare notification banners
        run: |
          if grep -rn "display notification" pkgs/pounce-commands pkgs/pounce/ports \
             | grep -v "item 1 of argv"; then
            echo
            echo "Above: a banner that bypasses notify(). See AGENTS.md § Notifications —"
            echo "notify() draws through trill when the Mac has it, and falls back to this"
            echo "same osascript when it doesn't. Call it instead."
            exit 1
          fi
