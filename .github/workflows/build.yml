name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR branch makes the first run's answer worthless, and the
# abandoned run still holds a runner — on the macOS ones, a queue slot the next
# PR then waits behind.
#
# Only a PR run is ever in a shared group. Everything else keys on the commit,
# so it gets a group of its own: putting main pushes in one group would
# SERIALIZE them even with cancelling off, and GitHub cancels a *pending* run
# when a newer one joins its group — so three merges inside one build would
# leave the middle commit with no run at all. That is the tick this is
# supposed to protect.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: nix build (aarch64-darwin)
    # The build shells out to /usr/bin/xcrun swiftc, so it needs a real Mac with
    # Xcode CLT — macos-14+ runners are Apple Silicon and ship Xcode. The floor
    # is the SDK, not the runner: Window.swift overrides `contextMenuKeyDown:` /
    # `showContextMenuForSelection:`, which NSResponder.h only declares at
    # macOS 15, and an SDK that never heard of a method cannot be overridden at
    # any deployment target. What the app RUNS on is unaffected — build.sh pins
    # -target to macos14.0, so a newer runner does not raise users' floor.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # This used to say Determinate was here because its installer relaxes the
      # macOS build sandbox, which the impure xcrun build requires. It does not,
      # and the build does not: nix's `sandbox` defaults to true on Linux and
      # FALSE on every other platform, and neither installer writes a `sandbox`
      # line at all — there was never anything to relax. `relaxed` is in fact
      # the setting that BREAKS this build, because it exempts fixed-output and
      # `__noChroot` derivations and pkgs/pounce's derivation is neither: run
      # that way on a probe branch it died on `/usr/bin/xcrun: Operation not
      # permitted`, exit 126, exactly as `sandbox = true` did.
      #
      # Which leaves the installer free to be the cheap one. Paired against
      # DeterminateSystems/nix-installer-action over eight runs on macos-15,
      # this step is 5.1s against 68.2s — 3-13s against 61-75s, no overlap — for
      # the same derivation hash out the other end (the job total went 234s to
      # 183s over that sample).
      # Determinate spends 22s of the difference configuring Time Machine
      # exclusions on a runner that has no Time Machine, and no input turns that
      # off. The tag pins the nix version with it: v35 installs 2.34.7.
      # Measurement: workshop script/probes/README.md, *quick-install on a Mac*.
      - uses: nixbuild/nix-quick-install-action@v35
      # With the installer down to seconds this step is 87-94% of the job on the
      # four real runs since the swap, and three quarters of IT is one `swiftc`.
      # Phase-split over 23 quick-install runs (workshop script/probes/README.md,
      # *pounce's nix build, phase by phase*): 75.3% is pkgs/pounce's own
      # buildPhase, 17.9% fetches the flake inputs — nixpkgs' source tree,
      # substituted from cache.nixos.org — 4.6% is the twenty small derivations
      # around the compile, 1.5% evaluates, and 0.8% substitutes the 114.5 MiB
      # the build plan asks for. The 8 Determinate arms in that section agree on
      # the shape (74.7% / 18.0% / 1.5%) on a smaller 104.1 MiB closure, because
      # that installer leaves more of it in the store.
      #
      # The total swings 119-202s on sources that never changed, so read the
      # share and not the second: `swiftc` held 69.4-78.8% of the step in every
      # one of the 31 runs across both installers.
      #
      # Two things follow. There is nothing to split — one derivation holds
      # three quarters of it, and the 30s in front of the build plan is
      # per-job work a second job would pay over again. And a /nix store cache
      # reaches the 18% rather than the 75%; that section has the arithmetic,
      # and the macOS restore figure the refusal now hangs on, which nobody has
      # measured.
      - run: nix build .#pounce .#pounce-commands .#pounce-skill --print-build-logs

  test:
    name: frecency unit tests (swift)
    # Uses /usr/bin/xcrun swiftc, same as the app build — needs a real Mac, and
    # the same macOS 15 SDK for the same reason (see the build job).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: compile + run pure-logic tests
        run: pkgs/pounce/tests/run.sh

  skills:
    name: check the agent skills
    # Pure bash and grep — no Mac, no Nix. `nix build .#pounce-skill` runs the
    # SAME script, but only on a runner that has Nix; the failures these guards
    # catch (broken frontmatter, a description too short to route on, a file
    # that has grown into a manual) are invisible at runtime, so they want the
    # fastest job that can see them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: script/check-skills.sh

  commands:
    name: shellcheck pounce-commands
    runs-on: ubuntu-latest
    # A ceiling, not a target: this runs in seconds. GitHub's default is six
    # hours, which a hung step would spend in full.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The launcher's shell commands (pkgs/pounce-commands) — lint at warning
      # level (real bugs: undefined vars, bad quoting) on a fast Linux runner,
      # no Mac needed. Verified clean at this severity.
      # shellcheck ships on the ubuntu-latest image — 0.9.0 on 24.04, the same
      # build apt was fetching, so the lint result is unchanged. The `apt-get
      # update` that used to stand in front of it bought nothing and, on the
      # day the Azure mirrors go quiet, hangs rather than fails (haus/check.yml
      # has the long version).
      #
      # The version is the IMAGE's now, and it moves when the image does: 26.04
      # carries 0.11.0, which turns SC2015 off. Printing it is what makes that
      # day read as a version change rather than as a line nobody touched.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck --severity=warning pkgs/pounce-commands/pounce-palette pkgs/pounce-commands/commands/*.sh pkgs/pounce-commands/optional/*.sh pkgs/pounce/ports script/check-skills.sh
      # A rule with nothing enforcing it is a rule the thirteenth command
      # breaks silently. Every banner pounce draws goes through the `notify()`
      # helper (AGENTS.md § Notifications) so that trill can draw it and
      # rules.json can route it; a bare `display notification` is the one way
      # to bypass that, and it looks completely normal in review.
      #
      # `display dialog` is deliberately NOT matched — that is a modal question
      # (docker.sh, caffeinate.sh), not a banner, and trill has no verb for it.
      - name: no bare notification banners
        run: |
          if grep -rn "display notification" pkgs/pounce-commands pkgs/pounce/ports \
             | grep -v "item 1 of argv"; then
            echo
            echo "Above: a banner that bypasses notify(). See AGENTS.md § Notifications —"
            echo "notify() draws through trill when the Mac has it, and falls back to this"
            echo "same osascript when it doesn't. Call it instead."
            exit 1
          fi
