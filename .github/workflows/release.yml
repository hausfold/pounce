name: release

# Tag v<date> (CalVer, e.g. v2026.07.18) -> build + sign + notarize Pounce.app
# -> GitHub release with a prebuilt macOS tarball -> Homebrew formula bump.
#
# The tarball ships a prebuilt Pounce.app signed with our Developer ID (hardened
# runtime) and notarized by Apple, plus the command scripts. Because it is
# prebuilt and signed, every install normally shares ONE stable code identity —
# so the Accessibility/TCC grant survives upgrades (an ad-hoc build changed
# identity on every rebuild and had to be re-granted). The one deliberate
# exception is the com.local.pounce -> com.hausfold.pounce identifier migration;
# release notes keep that one-time re-approval visible to skip-version upgraders.
# arm64 only, matching the nix target.
#
# The bundled Palette+nebelung.generated.swift is rendered from the PINNED
# nebelung input, so the release gets the exact palette this flake.lock pins.
#
# Cut tags with `bench release pounce` from the workshop; it enforces that the
# tag matches pkgs/pounce's version and that everything is pushed.
#
# Signing/notarization secrets (set once, per repo):
#   MACOS_CERT_P12       base64 of the exported "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD  the password protecting that .p12
#   NOTARY_KEY_P8        base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID        that key's Key ID
#   NOTARY_ISSUER_ID     the App Store Connect issuer ID

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build + publish release
    # macOS 15 SDK required: Window.swift overrides macOS 15-only NSResponder
    # methods. build.sh pins -target to macos14.0, so the shipped app's floor
    # stays 14 regardless of which runner builds it. Note that build.sh pins `minos`
    # only — the LINKED sdk does move with the runner, and AppKit gates a few
    # behaviours on that rather than on the deployment target.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Check the tag matches pkgs/pounce's version
        run: |
          VERSION="$(nix eval --raw .#packages.aarch64-darwin.pounce.version)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != pkgs/pounce version $VERSION — bump default.nix or retag" >&2
            exit 1
          fi

      - name: Build Pounce.app (pinned palette, via the shared build.sh)
        run: |
          VERSION="$(nix eval --raw .#packages.aarch64-darwin.pounce.version)"
          # Same palette the Nix build bakes in, rendered from the pinned input.
          nix eval --raw .#packages.aarch64-darwin.pounce.paletteSwift \
            > pkgs/pounce/Palette+nebelung.generated.swift
          POUNCE_VERSION="$VERSION" bash pkgs/pounce/build.sh

      - name: Import Developer ID signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          [ -n "$IDENTITY" ]
          SIGNER_NAME="${IDENTITY#Developer ID Application: }"
          SIGNER_NAME="${SIGNER_NAME% (*}"
          echo "::add-mask::$IDENTITY"
          echo "::add-mask::$SIGNER_NAME"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign Pounce.app (Developer ID, hardened runtime)
        run: |
          IDENTITY="$(security find-identity -v -p codesigning "$SIGN_KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          # Camera peek needs the hardened-runtime camera exception (Pounce.entitlements).
          codesign --force --options runtime --timestamp \
            --entitlements pkgs/pounce/Pounce.entitlements \
            --sign "$IDENTITY" \
            pkgs/pounce/Pounce.app

      - name: Notarize + staple
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY_P8" | base64 -d > "$RUNNER_TEMP/notary.p8"
          CREDS=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          ditto -c -k --sequesterRsrc --keepParent pkgs/pounce/Pounce.app "$RUNNER_TEMP/notarize.zip"
          # `submit --wait` exits 0 even when the verdict is Invalid, so check the
          # status ourselves and dump Apple's per-file reasons before failing.
          JSON="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${CREDS[@]}" --wait --output-format json)"
          echo "$JSON"
          read -r ID STATUS < <(echo "$JSON" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("id",""),d.get("status",""))')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::notarization $STATUS — Apple's log:"
            xcrun notarytool log "$ID" "${CREDS[@]}" || true
            exit 1
          fi
          xcrun stapler staple pkgs/pounce/Pounce.app
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Verify signature + notarization
        run: |
          codesign --verify --deep --strict --verbose=2 pkgs/pounce/Pounce.app
          spctl --assess --type execute pkgs/pounce/Pounce.app

      - name: Assemble prebuilt macOS tarball
        run: |
          STAGE="$RUNNER_TEMP/pounce-$GITHUB_REF_NAME"
          mkdir -p "$STAGE/commands" dist
          # Stapled app + the CLI/daemon scripts the formula installs alongside it.
          cp -R pkgs/pounce/Pounce.app "$STAGE/"
          cp pkgs/pounce/ports "$STAGE/"
          cp pkgs/pounce-commands/pounce-palette "$STAGE/"
          cp pkgs/pounce-commands/commands/*.sh "$STAGE/commands/"
          tar -czf "dist/pounce-$GITHUB_REF_NAME-macos.tar.gz" \
            -C "$RUNNER_TEMP" "pounce-$GITHUB_REF_NAME"

      - name: Build + notarize the DMG (the human download)
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The tarball above is the FORMULA's artifact (bump-tap curls it by
          # that exact name — never rename it). The DMG is the website's
          # "Download for macOS" artifact: the stapled app + an /Applications
          # symlink, nothing to explain. The app is self-contained since the
          # commands ship in Contents/Resources/commands (build.sh) and the
          # login item is self-registered on first launch (LoginItem.swift), so
          # drag-to-Applications IS the whole install.
          DMG_STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$DMG_STAGE"
          cp -R pkgs/pounce/Pounce.app "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "Pounce" -srcfolder "$DMG_STAGE" -ov -format UDZO \
            "dist/pounce-$GITHUB_REF_NAME-macos.dmg"

          IDENTITY="$(security find-identity -v -p codesigning "$SIGN_KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          codesign --force --timestamp --sign "$IDENTITY" "dist/pounce-$GITHUB_REF_NAME-macos.dmg"

          # Notarize + staple the DMG itself, so Gatekeeper clears it while
          # still mounting (the app's own staple only covers post-copy runs).
          echo "$NOTARY_KEY_P8" | base64 -d > "$RUNNER_TEMP/notary-dmg.p8"
          CREDS=(--key "$RUNNER_TEMP/notary-dmg.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          JSON="$(xcrun notarytool submit "dist/pounce-$GITHUB_REF_NAME-macos.dmg" "${CREDS[@]}" --wait --output-format json)"
          echo "$JSON"
          read -r ID STATUS < <(echo "$JSON" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("id",""),d.get("status",""))')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::DMG notarization $STATUS — Apple's log:"
            xcrun notarytool log "$ID" "${CREDS[@]}" || true
            exit 1
          fi
          xcrun stapler staple "dist/pounce-$GITHUB_REF_NAME-macos.dmg"
          rm -f "$RUNNER_TEMP/notary-dmg.p8"

      - name: Create GitHub release
        run: |
          cat > "$RUNNER_TEMP/identifier-migration.md" <<'EOF'
          ### Upgrade note

          If you are upgrading from a build whose bundle identifier was
          `com.local.pounce`, macOS will ask you to approve Pounce in
          **System Settings → Privacy & Security → Accessibility** one more time.
          The app and standalone login item now use the canonical hausfold IDs.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes \
            --notes-file "$RUNNER_TEMP/identifier-migration.md"
        env:
          GH_TOKEN: ${{ github.token }}

  # pounce's flake wraps this release tarball, pinned by version + sha256 in
  # nix/release.nix. Rewrite the pin on main so a downstream `bench ship` can
  # ripple the new release into haus's lock. The version/sha lines are CI-owned;
  # humans never bump them (AGENTS.md's routing table).
  # Concurrency keeps two near-simultaneous tags from interleaving: the
  # in-progress pin push is cancelled and the newest tag re-runs, so the pin
  # always ends up pointing at the newest release.
  bump-pin:
    name: bump nix/release.nix
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bump-pin
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point nix/release.nix at the new release
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/pounce.tar.gz \
            "https://github.com/hausfold/pounce/releases/download/$TAG/pounce-$TAG-macos.tar.gz"
          SHA="$(sha256sum /tmp/pounce.tar.gz | cut -d' ' -f1)"
          sed -i -E \
            -e "s#^  version = \".*\";#  version = \"$VER\";#" \
            -e "s#^  sha256 = \".*\";#  sha256 = \"$SHA\";#" \
            nix/release.nix
          if git diff --quiet; then
            echo "nix/release.nix already current"
            exit 0
          fi
          git config user.name "haus-release[bot]"
          git config user.email "haus-release@users.noreply.github.com"
          git commit -am "pounce ${VER} (nix release pin)"
          # The release job ran ~10-20 min; anything that landed on main in the
          # meantime would reject the push from the checkout snapshot, and the
          # release would ship with a stale pin. Rebase the pin commit onto
          # fresh main first — a rebase conflict here means a human hand-edited
          # the CI-owned lines, and failing loudly is the right answer.
          git pull --rebase origin main
          git push

  bump-tap:
    name: bump hausfold/homebrew-tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hausfold/homebrew-tap
          # Write deploy key for the tap repo, stored as a secret here. The
          # formula's version/sha lines are CI-owned; humans never bump them.
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Point Formula/pounce.rb at the new release
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/pounce.tar.gz \
            "https://github.com/hausfold/pounce/releases/download/$TAG/pounce-$TAG-macos.tar.gz"
          SHA="$(sha256sum /tmp/pounce.tar.gz | cut -d' ' -f1)"
          sed -i -E \
            -e "s#^  version \".*\"#  version \"$VER\"#" \
            -e "s#^  sha256 \".*\"#  sha256 \"$SHA\"#" \
            -e 's#com\.local\.pounce#com.hausfold.pounce#g' \
            -e '/^  revision [0-9]+$/d' \
            Formula/pounce.rb
          grep -q 'com.hausfold.pounce' Formula/pounce.rb || {
            echo "::error::formula did not adopt com.hausfold.pounce"
            exit 1
          }
          if grep -q 'com.local.pounce' Formula/pounce.rb; then
            echo "::error::legacy pounce identifier remains in formula"
            exit 1
          fi
          if git diff --quiet; then
            echo "formula already current"
            exit 0
          fi
          git config user.name "haus-release[bot]"
          git config user.email "haus-release@users.noreply.github.com"
          git commit -am "pounce ${VER}"
          git push
